name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:site-diag.exe `
                 /win32icon:assets\site-diag.ico /codepage:65001 /optimize+ `
                 src\Net.cs src\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test
        shell: pwsh
        run: |
          $out = & .\site-diag.exe --version
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: site-diag
          path: site-diag.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: site-diag.exe
          generate_release_notes: true